# 푸시할 때마다 Windows와 Ubuntu에서 새 환경을 만들어 전체 점검을 돌린다.
# (check_env: 패키지·한국어 모델·키트·훅 설치기·훅 어댑터·페이지 데이터/빌드 재현, npm test: 페이지 렌더)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 파이썬 패키지 설치
        run: python -m pip install -r requirements.txt

      - name: 환경 점검 + 스모크 테스트
        run: python tests/check_env.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 페이지 자동 점검
        run: |
          npm ci
          npm test
